<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>行舟影视 Like连接</title><style>body{width:300px;padding:16px;font:14px system-ui;color:#263247}h2{font-size:18px;margin:0 0 10px}p{line-height:1.6;color:#6c7890}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #deddeb;border-radius:8px}button{width:100%;padding:10px;border:0;border-radius:8px;background:#7963c2;color:white;margin-top:10px}#state{white-space:pre-wrap}small{color:#8590a4}</style><h2>连接行舟影视</h2><p>先打开行舟影视，在“连接 Like画布”生成配对码，再填在这里。配对后会自动恢复连接。</p><label>8位配对码<input id="code" maxlength="8" inputmode="numeric" autocomplete="off"></label><button id="pair">配对本机行舟</button><p id="state" role="status"></p><small>只访问Like页面和本机连接服务，不读取登录Cookie，不自动生成视频。</small><script src="popup.js"></script></html>
