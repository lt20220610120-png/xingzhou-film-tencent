<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="一个无限画布创作工具" />
        <link rel="icon" href="./logo.svg" />
        <title>无限画布</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
        <script>
            const reportCanvasRoute = () => window.parent !== window && window.parent.postMessage({ type: 'xingzhou-canvas-route', hash: window.location.hash || '#/canvas' }, '*');
            window.addEventListener('hashchange', reportCanvasRoute);
            window.addEventListener('popstate', reportCanvasRoute);
            ['pushState', 'replaceState'].forEach(method => {
                const original = history[method];
                history[method] = function(...args) { const result = original.apply(this, args); reportCanvasRoute(); return result; };
            });
            if (!window.location.hash) history.replaceState(null, '', '#/canvas');
            window.addEventListener('load', reportCanvasRoute);
        </script>
      <script type="module" crossorigin src="./assets/index-CNElSIo3.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-BsEuu3Qu.css">
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="./config.js"></script>
    </body>
</html>
