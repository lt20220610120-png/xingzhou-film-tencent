# 临时恢复：IP 的 HTTP API 直通；域名 HTTP 仍跳 HTTPS。备案完成后可移除第一个 server。
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 200m;
  location /api/ {
    proxy_pass http://127.0.0.1:4310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }
  location = /healthz { proxy_pass http://127.0.0.1:4310/healthz; }
  location / { return 404; }
}

server {
  listen 80;
  server_name xingzhoufilm.cn www.xingzhoufilm.cn;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl default_server;
  server_name xingzhoufilm.cn www.xingzhoufilm.cn;
  ssl_certificate /etc/letsencrypt/live/xingzhoufilm.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/xingzhoufilm.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 200m;
  root /var/www/xingzhou;
  location /api/ { proxy_pass http://127.0.0.1:4310; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300s; }
  location = /healthz { proxy_pass http://127.0.0.1:4310/healthz; }
  location / { try_files $uri $uri/ /index.html; }
}
