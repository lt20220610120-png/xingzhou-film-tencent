server {
  listen 80 default_server;
  server_name xingzhoufilm.cn www.xingzhoufilm.cn;
  # 保留 ACME 续期路径，其余全部跳转 HTTPS
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2 default_server;
  server_name xingzhoufilm.cn www.xingzhoufilm.cn;

  ssl_certificate     /etc/letsencrypt/live/xingzhoufilm.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/xingzhoufilm.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;

  client_max_body_size 200m;
  root /var/www/xingzhou;

  location /api/ {
    proxy_pass http://127.0.0.1:4310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location = /healthz { proxy_pass http://127.0.0.1:4310/healthz; }
  location / { try_files $uri $uri/ /index.html; }
}
