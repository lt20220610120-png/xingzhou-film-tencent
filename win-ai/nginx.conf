server {
  listen 80;
  server_name winai.xingzhoufilm.cn;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name winai.xingzhoufilm.cn;
  ssl_certificate /etc/letsencrypt/live/winai.xingzhoufilm.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/winai.xingzhoufilm.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 64m;
  root /opt/win-ai/public;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = / { try_files /index.html =404; }
  location = /welcome { try_files /index.html =404; }
  location = /docs { try_files /docs.html =404; }
  location = /docs/ { return 301 /docs; }
  location = /payment-setup { try_files /payment-setup.html =404; }
  location ~ ^/(brand\.svg|site\.css|site\.js)$ { try_files $uri =404; }
  location /source/ { alias /opt/win-ai/source/; autoindex off; }
  location /downloads/ { alias /opt/win-ai/downloads/; autoindex off; }

  # Identity bridge belongs to Xingzhou; native gateway keeps final authentication.
  location ^~ /api/win-ai/ {
    access_log off;
    proxy_pass http://127.0.0.1:4310;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /api/user/epay/notify {
    access_log off;
    proxy_pass http://127.0.0.1:4310/api/win-ai/epay-notify;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
  }
  location = /api/subscription/epay/notify {
    access_log off;
    proxy_pass http://127.0.0.1:4310/api/win-ai/epay-subscription-notify;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
  }
  location = /api/subscription/epay/return {
    access_log off;
    return 303 /wallet?pay=pending;
  }
  location = /_win_ai_identity_guard {
    internal;
    access_log off;
    proxy_pass http://127.0.0.1:4310/api/win-ai/guard;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Winai-Original-Uri $request_uri;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header X-Goog-Api-Key $http_x_goog_api_key;
    proxy_set_header Mj-Api-Secret $http_mj_api_secret;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
  }
  # Password signup remains closed; native OAuth provisions linked accounts.
  location = /api/setup {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8317;
    proxy_set_header Host $host;
  }
  location = /api/user/register { default_type application/json; return 403 '{"success":false,"message":"Registration is disabled"}'; }

  # Payment API routes are available, but New API requires owner confirmation
  # and real merchant configuration before it can accept any payment.
  location ~ ^/(oauth/xingzhou|api/oauth/xingzhou)$ {
    access_log off;
    proxy_pass http://127.0.0.1:8317;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    auth_request /_win_ai_identity_guard;
    proxy_pass http://127.0.0.1:8317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # Normalize duplicate credential headers identically for guard and native auth.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header X-Goog-Api-Key $http_x_goog_api_key;
    proxy_set_header Mj-Api-Secret $http_mj_api_secret;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
