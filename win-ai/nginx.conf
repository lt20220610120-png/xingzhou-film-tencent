server {
  listen 80;
  server_name winai.xingzhoufilm.cn;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name winai.xingzhoufilm.cn;
  ssl_certificate /etc/letsencrypt/live/winai.xingzhoufilm.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/winai.xingzhoufilm.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 64m;
  root /opt/win-ai/public;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = / { try_files /index.html =404; }
  location = /welcome { try_files /index.html =404; }
  location = /docs { try_files /docs.html =404; }
  location = /docs/ { return 301 /docs; }
  location ~ ^/(brand\.svg|site\.css|site\.js)$ { try_files $uri =404; }
  location /source/ { alias /opt/win-ai/source/; autoindex off; }
  location /downloads/ { alias /opt/win-ai/downloads/; autoindex off; }

  # Closed at both UI and HTTP boundary for the first release.
  location = /api/setup { return 403; }
  location = /api/user/register { default_type application/json; return 403 '{"success":false,"message":"Registration is disabled"}'; }
  location ~ ^/api/(subscription|redemption|stripe|creem|waffo|waffo-pancake)(/|$) { return 403; }
  location ~ ^/api/user/(topup|amount|pay|epay|stripe|creem|waffo|waffo-pancake)(/|$) { return 403; }

  location / {
    proxy_pass http://127.0.0.1:8317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
