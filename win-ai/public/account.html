<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Win AI</title><link rel="icon" href="/brand.svg" type="image/svg+xml"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/account.css"><script defer src="/account.js"></script></head><body>
<header class="nav"><a class="brand" href="/"><img src="/brand.svg" alt=""><span>Win AI</span></a><nav aria-label="主导航"><a href="/docs">接入文档</a><a href="/">返回首页</a></nav></header>
<main class="account-layout"><section class="account-intro"><div class="eyebrow">WIN AI / 统一模型接入</div><h1>一个账号，<br>连接你的 AI。</h1><p>直接在浏览器管理 API 密钥、钱包与调用记录。<br>已有行舟影视账号，可使用原账号密码登录。</p><div class="account-note"><strong>网页与软件，使用同一个账号。</strong><p>从行舟影视内进入时会自动登录，无需再次注册。<br>网站注册开通 API 账户，影视工作权限由管理员另行开通。</p></div></section>
<section class="account-card" aria-labelledby="form-title"><nav class="account-tabs" aria-label="账号入口"><a href="/login" data-mode="login">登录</a><a href="/register" data-mode="register">注册</a></nav><h2 id="form-title">登录 Win AI</h2><p class="account-subtitle" id="form-subtitle">使用你的行舟影视或 Win AI 账号。</p>
<form id="account-form"><label data-field="username">账号<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" placeholder="3–32位字母、数字或下划线"></label>
<label data-field="email" hidden>邮箱<input name="email" type="email" autocomplete="email" maxlength="254" placeholder="用于验证和找回密码"></label>
<label data-field="emailCode" hidden>邮箱验证码<span class="account-code"><input name="emailCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" placeholder="8位验证码"><button type="button" id="send-code">发送验证码</button></span></label>
<label data-field="password">密码<input name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128" placeholder="请输入密码"></label>
<label data-field="confirmPassword" hidden>确认密码<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="再次输入密码"></label>
<p id="account-message" role="status" aria-live="polite"></p><button class="button primary account-submit" type="submit">登录</button></form>
<div class="account-links"><a href="/recover">忘记密码？</a><a href="/docs">如何使用 API →</a></div><p class="account-help">模型、价格与在线充值以控制台实际开放情况为准。</p><noscript>请启用 JavaScript 后使用账号功能。</noscript></section></main>
<footer class="wrap account-footer">Win AI · 行舟影视统一账号服务 · <a href="/source/LICENSE">AGPL-3.0</a></footer></body></html>
