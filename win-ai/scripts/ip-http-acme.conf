# Preserve the existing IP HTTP gateway; add only the certificate challenge.
server {
  listen 80;
  server_name 106.55.41.128;
  client_max_body_size 200m;
  location ^~ /.well-known/acme-challenge/ { root /var/www/win-ai-acme; }
  location /api/ {
    proxy_pass http://127.0.0.1:4310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
  }
  location = /healthz { proxy_pass http://127.0.0.1:4310/healthz; }
  location / { return 404; }
}
